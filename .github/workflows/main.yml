name: Build RootHide DEB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install RootHide Theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Validate project
        run: /usr/bin/python3 scripts/validate_project.py
        
      - name: Build release package
        run: >-
          make clean package FINALPACKAGE=1
          THEOS_PACKAGE_SCHEME=roothide
          ARCHS="arm64 arm64e"
          TARGET=iphone:clang:latest:15.0

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: PrismCam-RootHide-DEB
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
